name: Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r BuildFactory/requirements.txt
      - name: Run BuildFactory doctor
        run: python BuildFactory/build.py doctor
      - name: Run test suite
        run: pytest -q BuildFactory/tests
