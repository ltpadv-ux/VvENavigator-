name: Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore governance state
        uses: actions/cache/restore@v4
        with:
          path: |
            BuildFactory/artifacts/verification/release-history.json
            BuildFactory/artifacts/verification/continuous-improvement-backlog.json
            BuildFactory/artifacts/verification/governance-decision-register.json
            BuildFactory/artifacts/verification/alv-decision-workflow.json
            BuildFactory/artifacts/verification/alv-execution-mandates.json
          key: vve-governance-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            vve-governance-state-${{ github.ref_name }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r BuildFactory/requirements.txt
      - name: Run BuildFactory doctor
        run: python BuildFactory/build.py doctor
      - name: Run test suite
        run: pytest -q BuildFactory/tests
      - name: Run 34-apartment production verification
        run: python BuildFactory/run_production_verification.py BuildFactory/data/sample_vve_34.json --output BuildFactory/artifacts/verification
      - name: Save governance state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            BuildFactory/artifacts/verification/release-history.json
            BuildFactory/artifacts/verification/continuous-improvement-backlog.json
            BuildFactory/artifacts/verification/governance-decision-register.json
            BuildFactory/artifacts/verification/alv-decision-workflow.json
            BuildFactory/artifacts/verification/alv-execution-mandates.json
          key: vve-governance-state-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload verified production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vve-navigator-production-verification
          path: BuildFactory/artifacts/verification
          if-no-files-found: warn
